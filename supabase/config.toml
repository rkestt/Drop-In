project_id = "drop-in"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["../scripts/seed_courts.sql"]

[db.pooler]
enabled = false
port = 54329

[realtime]
enabled = true

[studio]
enabled = true
port = 54333

[local_smtp]
enabled = true
port = 54334

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
# Recupero/invito password (#109): due flussi, stessa schermata finale
# `/auth/nuova-password` (il `next` inciso nel redirectTo):
# - recupero via `resetPasswordForEmail`: flusso code/PKCE, redirectTo =
#   `<site_url>/api/auth/callback?next=/auth/nuova-password` (la API route
#   scambia il `code` e imposta la sessione);
# - invito via Admin API / `generateLink`: verify torna con la sessione nel
#   fragment (`#access_token=...`, invisibile al server), redirectTo =
#   `<site_url>/auth/callback?next=/auth/nuova-password` (pagina client
#   che imposta la sessione e rimbalza al `next`).
# Entrambi restano same-origin sotto site_url (sottopercorsi con query
# ammessi): niente da aggiungere qui in locale; su staging/prod va
# allowlistato l'origin remoto.
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# --- Email auth -----------------------------------------------------------
# Template brandizzati (lane email, #86): stessi file in locale, staging e
# prod. content_path e' relativo alla radice del repo.
# Runbook (SMTP dedicato, quota, deliverability): docs/email.md.
# Nota: su un progetto hosted il pannello Auth > Emails resta la fonte di
# verita'; questi file servono al dev locale e a `supabase config push`
# quando il campo e' supportato dalla CLI.
[auth.email.template.confirmation]
subject = "Conferma il tuo indirizzo email · Drop-In"
content_path = "./supabase/auth/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reimposta la password · Drop-In"
content_path = "./supabase/auth/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Il tuo link di accesso · Drop-In"
content_path = "./supabase/auth/templates/magic-link.html"

[auth.email.template.email_change]
subject = "Conferma il nuovo indirizzo · Drop-In"
content_path = "./supabase/auth/templates/email-change.html"

[auth.email.template.invite]
subject = "Invito a Drop-In"
content_path = "./supabase/auth/templates/invite.html"

# SMTP dedicato: si abilita per ambiente passando i valori via env (mai
# segreti nel repo). Lasciato spento in locale: il dev usa Mailpit (54334).
# [auth.smtp]
# enabled = true
# host = "env(SMTP_HOST)"
# port = 587
# user = "env(SMTP_USER)"
# pass = "env(SMTP_PASSWORD)"
# admin_email = "noreply@drop-in.app"
# sender_name = "Drop-In"

[auth.external.google]
enabled = true
client_id = "env(NEXT_PUBLIC_GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[analytics]
enabled = false


