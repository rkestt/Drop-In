name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values so `next build` can prerender pages that construct a
      # Supabase client at build time (e.g. NotificationToast via useMemo).
      # No network calls happen during prerender; never put real keys here.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build
      - run: rm -rf .next
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/a11y.spec.ts
      - run: npx playwright test tests/e2e/styleguide-visual.spec.ts
      # E2E richiede Supabase + Playwright browsers - step separato opzionale
      # - run: npx playwright install --with-deps chromium
      # - run: npm run test:e2e

  # e2e opzionale su richiesta (supabase locale via docker)
  # see: npx supabase start in CI requires docker setup - defer to manual
