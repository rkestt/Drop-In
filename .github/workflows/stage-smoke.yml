name: Stage smoke

# Dopo un push su `stage`: il deploy "per-branch" di Vercel si aggiorna da
# solo, l'alias leggibile `drop-in-stage.vercel.app` NO (va riassegnato con
# `npm run stage:alias`, che richiede la CLI autenticata: non gira in CI).
#
# Per questo lo smoke:
#  1. aspetta che il branch alias serva ESATTAMENTE il commit del push
#     (un 200 non basta: un deploy vecchio risponde 200);
#  2. verifica che l'alias leggibile serva lo stesso commit; se no, fallisce
#     dicendo di riassegnarlo. Così un alias fermo al build precedente non
#     passa più inosservato (è già successo: 19 h di build vecchio).
#
# Nessun secret richiesto: check HTTP anonimi.

on:
  push:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: stage-smoke
  cancel-in-progress: true

env:
  BRANCH_ALIAS: https://drop-in-git-stage-andrea-fioris-projects-14d416c7.vercel.app
  PUBLIC_ALIAS: https://drop-in-stage.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Attendi il deploy del commit (branch alias)
        run: |
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 20 "$BRANCH_ALIAS/api/health" || true)
            sha=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([a-f0-9]*\)".*/\1/p')
            echo "tentativo $i: commit=${sha:-nessuno}"
            if [ -n "$sha" ] && [ "${sha:0:12}" = "${GITHUB_SHA:0:12}" ]; then
              echo "deploy del commit pronto"; exit 0
            fi
            sleep 15
          done
          echo "Il branch alias non serve ${GITHUB_SHA:0:12} dopo 10 minuti: build fallita o non partita"
          exit 1

      - name: Smoke branch alias (commit atteso)
        run: node scripts/smoke.mjs "$BRANCH_ALIAS" --with-health --expect-commit "$GITHUB_SHA"

      - name: Smoke alias pubblico (stesso commit)
        run: |
          node scripts/smoke.mjs "$PUBLIC_ALIAS" --with-health --expect-commit "$GITHUB_SHA" || {
            echo "::error::drop-in-stage.vercel.app non serve il commit del push: esegui 'npm run stage:alias' e rilancia (l'alias custom non segue le release)."
            exit 1
          }
